<!DOCTYPE html>
<html lang="en">
<head>
<title>Inline SVG chart</title>
<style>
  @page { size: A5 landscape; margin: 12mm; }
  body { font-size: 9.5pt; color: #222; }
  h1 { font-size: 15pt; color: #1f4e79; margin: 0 0 1mm; }
  p { margin: 0 0 4mm; color: #555; }
  .note { font-size: 8pt; color: #888; margin-top: 3mm; }
</style>
</head>
<body>
  <h1>Monthly revenue</h1>
  <p>An inline <code>&lt;svg&gt;</code> is drawn as vector graphics (Batik) — sharp at any zoom.</p>
  <svg width="170mm" height="85mm" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg"
       font-family="Noto Sans" font-size="12">
    <defs>
      <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="300">
        <stop offset="0" stop-color="#2f6fa8"/><stop offset="1" stop-color="#1f4e79"/>
      </linearGradient>
    </defs>
    <!-- grid -->
    <g stroke="#ddd">
      <line x1="50" y1="20" x2="670" y2="20"/><line x1="50" y1="90" x2="670" y2="90"/>
      <line x1="50" y1="160" x2="670" y2="160"/><line x1="50" y1="230" x2="670" y2="230"/>
    </g>
    <line x1="50" y1="300" x2="670" y2="300" stroke="#888"/>
    <g fill="#888" text-anchor="end">
      <text x="42" y="304">0</text><text x="42" y="234">50k</text><text x="42" y="164">100k</text>
      <text x="42" y="94">150k</text><text x="42" y="24">200k</text>
    </g>
    <!-- bars: height = value * 1.4 px per k€ -->
    <g fill="url(#bar)">
      <rect x="62"  y="181" width="34" height="119"/><rect x="113" y="170" width="34" height="130"/>
      <rect x="164" y="146" width="34" height="154"/><rect x="215" y="132" width="34" height="168"/>
      <rect x="266" y="118" width="34" height="182"/><rect x="317" y="97"  width="34" height="203"/>
      <rect x="368" y="111" width="34" height="189"/><rect x="419" y="90"  width="34" height="210"/>
      <rect x="470" y="76"  width="34" height="224"/><rect x="521" y="62"  width="34" height="238"/>
      <rect x="572" y="55"  width="34" height="245"/><rect x="623" y="34"  width="34" height="266"/>
    </g>
    <!-- trend line -->
    <polyline fill="none" stroke="#e07b00" stroke-width="3" stroke-linejoin="round"
      points="79,181 130,170 181,146 232,132 283,118 334,97 385,111 436,90 487,76 538,62 589,55 640,34"/>
    <g fill="#e07b00">
      <circle cx="79" cy="181" r="4"/><circle cx="334" cy="97" r="4"/><circle cx="640" cy="34" r="4"/>
    </g>
    <g fill="#555" text-anchor="middle">
      <text x="79" y="320">Jan</text><text x="130" y="320">Feb</text><text x="181" y="320">Mar</text>
      <text x="232" y="320">Apr</text><text x="283" y="320">May</text><text x="334" y="320">Jun</text>
      <text x="385" y="320">Jul</text><text x="436" y="320">Aug</text><text x="487" y="320">Sep</text>
      <text x="538" y="320">Oct</text><text x="589" y="320">Nov</text><text x="640" y="320">Dec</text>
    </g>
  </svg>
  <div class="note">Rendered as PDF/A-1B: gradients and strokes are plain vector drawing, no transparency involved.</div>
</body>
</html>
